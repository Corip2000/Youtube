name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Raspakovat proekt
        run: |
          mkdir -p src
          unzip -q ShortsOffline-kotlin.zip -d src
          echo '--- soderzhimoe src ---'
          find src -maxdepth 3 -type d | sort

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Sborka debug APK
        working-directory: src
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Vylozhit APK
        uses: actions/upload-artifact@v4
        with:
          name: ShortsOffline-apk
          path: src/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
