name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Raspakovat arhiv v koren repozitoriya
        run: |
          if [ -f ShortsOffline-kotlin.zip ]; then
            unzip -o -q ShortsOffline-kotlin.zip -d .
            rm ShortsOffline-kotlin.zip
            git config user.name 'github-actions'
            git config user.email 'actions@github.com'
            git add -A
            git commit -m 'Raspakovat derevo proekta iz arhiva [skip ci]'
            git push
          fi
          ls -1

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Sborka debug APK
        run: gradle assembleDebug --no-daemon

      - name: Vylozhit APK
        uses: actions/upload-artifact@v4
        with:
          name: ShortsOffline-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
