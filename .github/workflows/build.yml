name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Raspakovat lyuboy arhiv proekta
        run: |
          zip=$(ls -1 ShortsOffline*.zip 2>/dev/null | head -1)
          if [ -n "$zip" ]; then
            echo "Raspakovyvayu $zip"
            rm -rf app gradle
            unzip -o -q "$zip" -d .
            rm -f ShortsOffline*.zip
            rm -f .github/workflows/build-apk.yml
            git config user.name 'github-actions'
            git config user.email 'actions@github.com'
            git add -A
            # Ni kommit, ni otpravka ne dolzhny ronyat sborku: fayly uzhe
            # lezhat na rannere, i APK soberetsya v lyubom sluchae.
            git commit -m 'Sinhronizirovat derevo proekta [skip ci]' || true
            git pull --rebase origin main || true
            git push || echo 'Otpravit ne vyshlo, sobirayu lokalno'
          else
            echo 'Arhivov net, sobirayu tekushchee derevo'
          fi
          ls -1

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Sborka debug APK
        run: gradle assembleDebug --no-daemon

      - name: Vylozhit APK
        uses: actions/upload-artifact@v4
        with:
          name: ShortsOffline-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
